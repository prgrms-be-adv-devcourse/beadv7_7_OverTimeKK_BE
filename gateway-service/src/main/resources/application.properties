spring.application.name=gateway-service
server.port=8080

# 게이트웨이는 DB가 없음 - 루트 build.gradle의 subprojects{} 블록이 모든 모듈에
# spring-boot-starter-data-jpa/mysql-connector-j를 강제로 넣어서, datasource 설정이 없으면
# 부팅 시 DataSource 자동구성이 실패한다. 그래서 명시적으로 꺼둠.
spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration

# user-service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

# order-service
spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${ORDER_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/order/**,/api/payments/**,/api/points/**,/api/settlements/**

# performance-service
spring.cloud.gateway.server.webmvc.routes[2].id=performance-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${PERFORMANCE_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/performances/**,/api/venues/**,/api/halls/**,/api/tickets/**,/api/standby/**
