services:
  mysql:
    image: mysql:8.4
    container_name: kdt-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"   # 각 서비스 application.properties의 값과 일치해야 함
      TZ: Asia/Seoul
    command:
      - --default-time-zone=+09:00
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - kdt-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  kdt-mysql-data:
